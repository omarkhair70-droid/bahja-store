name: Bahja PDP V1 QA

on:
  push:
    branches:
      - design/pdp-v1-gate
  workflow_dispatch:

concurrency:
  group: bahja-pdp-v1-gate
  cancel-in-progress: true

jobs:
  pdp-v1-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bahja-next.log 2>&1 &
          echo $! > /tmp/bahja-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/shop/black-gold-chain-thread-bag >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bahja-next.log
          exit 1

      - name: Run PDP visual and commerce QA
        run: node scripts/pdp-v1-qa.mjs

      - name: Upload PDP screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bahja-pdp-v1-qa
          path: qa-artifacts/
          if-no-files-found: error
